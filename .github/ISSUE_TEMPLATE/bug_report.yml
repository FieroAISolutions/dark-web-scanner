name: Bug report
description: Report a reproducible application problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include email addresses, tokens, API keys, or breach data. Use SECURITY.md for vulnerabilities.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and installation method
    validations:
      required: true
