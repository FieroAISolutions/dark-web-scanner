# Mirrors `main` of this private dev repo to a public read-only repo so
# operator installs can pull tarball-mode updates anonymously, without a
# GitHub token. Feature branches, draft PRs, and history outside `main`
# stay private.
#
# ── one-time setup ──────────────────────────────────────────────────────────
#
# 1. Create an empty public repo on github.com under the same owner, e.g.
#    `enfierno21/DarkWebScanner-Public`. Default branch `main`.
#
# 2. Generate an SSH deploy key locally:
#      ssh-keygen -t ed25519 -C "dws-mirror" -f deploy_key -N ""
#    This produces `deploy_key` (private) and `deploy_key.pub` (public).
#
# 3. On the **public mirror repo**: Settings → Deploy keys → Add deploy key
#    Paste the contents of `deploy_key.pub` and enable "Allow write access".
#
# 4. On **this private repo**: Settings → Secrets and variables → Actions
#    - New repository secret named `PUBLIC_MIRROR_DEPLOY_KEY`, value =
#      contents of `deploy_key` (the PRIVATE half — full file including the
#      BEGIN/END lines).
#    - New repository variable named `PUBLIC_MIRROR_REPO`, value =
#      `<owner>/<public-repo-name>` (e.g. `enfierno21/DarkWebScanner-Public`).
#
# 5. Once the mirror has run at least once, point operators' installs at it.
#    Either:
#      - Set `DWS_UPSTREAM_REPO=DarkWebScanner-Public` in the launcher
#        scripts (run_*.sh / .bat) before `python -m backend.main`, or
#      - Edit `UPSTREAM_REPO` default in `backend/updater.py`.
#    With the public mirror in use, no GitHub token is required on the host.
#
# ── ongoing behavior ────────────────────────────────────────────────────────
# Every push to `main` here triggers a fast-forward push to the public
# mirror. If history on this repo's `main` is ever rewritten, this workflow
# will fail loudly (it does not force-push) — that's intentional, so an
# accidental rewrite never propagates to the public channel.

name: Mirror main to public

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Don't run concurrent mirror pushes (would race the remote ref).
  group: mirror-public
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # we use our own key, not GITHUB_TOKEN

      - name: Verify config
        env:
          MIRROR_REPO: ${{ vars.PUBLIC_MIRROR_REPO }}
          DEPLOY_KEY: ${{ secrets.PUBLIC_MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$MIRROR_REPO" ]; then
            echo "::error::Repository variable PUBLIC_MIRROR_REPO is not set."
            echo "::error::Add it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Repository secret PUBLIC_MIRROR_DEPLOY_KEY is not set."
            exit 1
          fi
          echo "Mirroring to: $MIRROR_REPO"

      - name: Install deploy key
        env:
          DEPLOY_KEY: ${{ secrets.PUBLIC_MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Push to public mirror
        env:
          MIRROR_REPO: ${{ vars.PUBLIC_MIRROR_REPO }}
        run: |
          git config user.name "DWS mirror bot"
          git config user.email "noreply@users.noreply.github.com"
          git remote add public "git@github.com:${MIRROR_REPO}.git"
          # Fast-forward only — refuse to propagate a history rewrite.
          git push public HEAD:refs/heads/main
